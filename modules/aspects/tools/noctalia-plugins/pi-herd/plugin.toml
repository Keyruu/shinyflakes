id = "local/pi-herd"
name = "Pi Herd"
version = "1.0.0"
plugin_api = 3
author = "lucas"
icon = "robot"
description = "Shows running pi instances (waiting/total) with per-instance detail tooltip."

[[setting]]
key = "interval"
type = "int"
label_key = "settings.interval.label"
default = 10
min = 2
max = 300

[[widget]]
id = "widget"
entry = "widget.luau"
