id = "local/calendar-event"
name = "Calendar Event"
version = "1.0.0"
plugin_api = 3
author = "lucas"
icon = "calendar"
description = "Shows next calendar event in the bar with agenda tooltip."

[[setting]]
key = "interval"
type = "int"
label_key = "settings.interval.label"
default = 60
min = 5
max = 3600

[[widget]]
id = "widget"
entry = "widget.luau"

  [[widget.setting]]
  key = "max_length"
  type = "int"
  label_key = "settings.max_length.label"
  default = 25
  min = 10
  max = 100

[[service]]
id = "fetcher"
entry = "service.luau"
