# tix.toml — generated by `tix init`

[context.nixos]
includes = ["nix/hosts/**/*.nix", "nix/modules/**/*.nix"]
excludes = ["nix/modules/home/**/*.nix"]
stubs = ["@nixos"]

[context.home-manager]
includes = ["nix/home/**/*.nix"]
stubs = ["@home-manager"]

[context.callpackage]
includes = ["nix/packages/**/*.nix"]
stubs = ["@callpackage"]

[stubs.generate]
nixpkgs = { expr = "(builtins.getFlake (toString ./.)).inputs.nixpkgs" }
home-manager = { expr = "(builtins.getFlake (toString ./.)).inputs.home-manager" }


[project]
includes = ["flake.nix", "nix/**/*.nix"]
excludes = ["result", ".direnv"]
